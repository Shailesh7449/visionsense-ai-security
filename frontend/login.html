<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISION SENSE — Operator Portal</title>
  <link rel="stylesheet" href="/vision-sense.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative;">
  <!-- Background 3D Canvas -->
  <canvas id="login-core-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;"></canvas>

  <!-- Login Card Overlay -->
  <div class="vs-card" style="position: relative; z-index: 10; max-width: 440px; width: 100%; margin: 20px; border-color: var(--vs-border-cyan); box-shadow: var(--vs-shadow-glow-cyan), 0 25px 60px rgba(0,0,0,0.9); backdrop-filter: blur(12px); background: rgba(17, 24, 39, 0.9);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; width: 56px; height: 56px; border-radius: 16px; background: rgba(6, 182, 212, 0.15); border: 1px solid var(--vs-border-cyan); align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: 0 0 20px rgba(6,182,212,0.3);">
        <span style="font-size: 24px;">🛡️</span>
      </div>
      <h1 style="font-size: 22px; font-weight: 800; color: var(--vs-text-white); letter-spacing: 0.5px;">VISION SENSE</h1>
      <p style="font-size: 11px; color: var(--vs-cyan); font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Security Operations Center</p>
    </div>

    <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="font-size: 12px; color: var(--vs-text-muted); display: block; margin-bottom: 6px;">Operator Identifier / Badge ID</label>
        <input type="text" class="vs-input" id="login-user" value="operator.lead@visionsense.soc" required />
      </div>

      <div>
        <label style="font-size: 12px; color: var(--vs-text-muted); display: block; margin-bottom: 6px;">Access Key / Password</label>
        <input type="password" class="vs-input" id="login-pass" value="••••••••••••" required />
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
        <label style="display: flex; align-items: center; gap: 6px; color: var(--vs-text-body); cursor: pointer;">
          <input type="checkbox" checked /> Remember Station
        </label>
        <a href="#" style="color: var(--vs-cyan); text-decoration: none;">Hardware Token?</a>
      </div>

      <button type="submit" class="vs-btn" style="margin-top: 10px; width: 100%; padding: 12px;">
        Authenticate & Launch SOC →
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--vs-border-subtle); padding-top: 16px;">
      <div style="font-size: 11px; color: var(--vs-text-muted);" class="mono">
        VISION SENSE v2.4 • YOLOv8 • ByteTrack • MMAction2
      </div>
    </div>
  </div>

  <script src="/vision-core.js"></script>
  <script>
    const canvas = document.getElementById('login-core-canvas');
    if (canvas && window.VisionCore) {
      VisionCore.init(canvas, {
        interactive: true,
        showNodes: true,
        particleCount: 260,
        initialStatus: 'NORMAL'
      });
    }

    function handleLogin(e) {
      e.preventDefault();
      window.location = '/dashboard';
    }
  </script>
</body>
</html>
